name: Build Hassani Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/full-messaging-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle'))
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              s, n1 = re.subn(r'compileSdk\s*=\s*[^\s]+', 'compileSdk = 36', s)
              s, n2 = re.subn(r'compileSdkVersion\s+[^\s]+', 'compileSdkVersion 36', s)
              p.write_text(s)
              print(f'{p}: compileSdk updated={bool(n1 or n2)}')
              if n1 or n2:
                  break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Add Android microphone and media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'''
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, marker + '\n    ' + permissions)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugin compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('android'), Path.home() / '.pub-cache' / 'hosted' / 'pub.dev']
          changed = 0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('build.gradle*'):
                  try:
                      s = p.read_text()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = re.sub(r'compileSdk\s*=\s*(?:flutter\.)?compileSdkVersion', 'compileSdk = 36', s)
                  updated = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', updated)
                  updated = re.sub(r'compileSdkVersion\s+(?:flutter\.)?compileSdkVersion', 'compileSdkVersion 36', updated)
                  updated = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', updated)
                  if updated != s:
                      p.write_text(updated)
                      changed += 1
          print(f'Patched {changed} Gradle files for Android compile SDK 36')
          PY
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hassani-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
