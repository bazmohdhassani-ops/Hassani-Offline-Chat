name: Build Android APK

on:
  push:
    branches:
      - feature/full-messaging-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle'))
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              s, n1 = re.subn(r'compileSdk\s*=\s*[^\s]+', 'compileSdk = 36', s)
              s, n2 = re.subn(r'compileSdkVersion\s+[^\s]+', 'compileSdkVersion 36', s)
              p.write_text(s)
              print(f'{p}: compileSdk updated={bool(n1 or n2)}')
              if n1 or n2:
                  break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Add Android microphone and media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + '\n    ' + permissions)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force Android compile SDK 36 for affected plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          targets = {'file_picker', 'flutter_plugin_android_lifecycle'}
          roots = set()
          metadata = Path('.flutter-plugins-dependencies')
          if metadata.exists():
              data = json.loads(metadata.read_text())
              for item in data.get('plugins', {}).get('android', []):
                  if item.get('name') in targets and item.get('path'):
                      root = Path(item['path'])
                      roots.add(root / 'android' if (root / 'android').is_dir() else root)

          cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          if cache.exists():
              for name in targets:
                  roots.update(cache.glob(name + '-*/android'))

          found = set()
          for root in roots:
              if not root.exists():
                  continue
              for gradle in [*root.glob('build.gradle'), *root.glob('build.gradle.kts')]:
                  found.add(gradle.parent.parent.name)
                  source = gradle.read_text()
                  # Replace the compile SDK expression whether Groovy or Kotlin DSL.
                  updated, count = re.subn(
                      r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?[^\n]+',
                      lambda m: m.group(1) + ('compileSdkVersion 36' if 'compileSdkVersion' in m.group(0) else 'compileSdk = 36'),
                      source
                  )
                  if count:
                      gradle.write_text(updated)
                  print(f'{gradle}: replacements={count}')
                  for line in updated.splitlines():
                      if 'compileSdk' in line:
                          print('  ' + line.strip())

          missing = targets - found
          if missing:
              print('WARNING: plugin Gradle files not found for: ' + ', '.join(sorted(missing)))
          PY
      - name: Analyze app source
        run: flutter analyze --no-pub --no-fatal-infos lib
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hassani-offline-chat-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
