name: Build Android APK

on:
  push:
    branches:
      - feature/full-messaging-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle'))
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              s, n1 = re.subn(r'compileSdk\s*=\s*[^\s]+', 'compileSdk = 36', s)
              s, n2 = re.subn(r'compileSdkVersion\s+[^\s]+', 'compileSdkVersion 36', s)
              p.write_text(s)
              print(f'{p}: compileSdk updated={bool(n1 or n2)}')
              if n1 or n2:
                  break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Add Android microphone and media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + '\n    ' + permissions)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force Android compile SDK 36 for affected plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          metadata = Path('.flutter-plugins-dependencies')
          plugin_roots = []
          if metadata.exists():
              data = json.loads(metadata.read_text())
              for plugin in data.get('plugins', {}).get('android', []):
                  name = plugin.get('name', '')
                  if name in ('file_picker', 'flutter_plugin_android_lifecycle'):
                      p = Path(plugin.get('path', ''))
                      if p.exists():
                          plugin_roots.append((name, p / 'android'))

          for name, root in plugin_roots:
              print(f'Inspecting {name}: {root}')
              for gradle in list(root.glob('build.gradle')) + list(root.glob('build.gradle.kts')):
                  s = gradle.read_text()
                  lines = s.splitlines()
                  out = []
                  changed = False
                  for line in lines:
                      if re.search(r'\bcompileSdk(?:Version)?\b', line) and not line.lstrip().startswith('//'):
                          indent = line[:len(line) - len(line.lstrip())]
                          if 'compileSdkVersion' in line:
                              line = indent + 'compileSdkVersion 36'
                          else:
                              line = indent + 'compileSdk = 36'
                          changed = True
                      out.append(line)
                  if changed:
                      gradle.write_text('\n'.join(out) + '\n')
                  print(f'  {gradle}: patched={changed}')
                  print('\n'.join(x.strip() for x in out if 'compileSdk' in x))
          PY
      - name: Analyze app source
        run: flutter analyze --no-pub --no-fatal-infos lib
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hassani-offline-chat-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
