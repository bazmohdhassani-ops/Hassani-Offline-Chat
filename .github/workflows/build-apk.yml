name: Build Android APK

on:
  push:
    branches:
      - feature/full-messaging-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s, n = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', s)
                  if not n:
                      s, n = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', s)
                  p.write_text(s)
                  print(f'{name}: updated={bool(n)}')
                  break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Add Android microphone and media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + '\n    ' + permissions)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze app source
        run: flutter analyze --no-pub --no-fatal-infos lib
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hassani-offline-chat-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
