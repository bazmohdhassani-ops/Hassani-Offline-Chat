name: Validate Lets Talk

on:
  pull_request:
    branches:
      - feature/full-messaging-foundation
  push:
    branches:
      - codex/private-chat-foundation
      - feature/full-messaging-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform scaffold
        run: flutter create --platforms=android --org com.hassani.letstalk .
      - name: Set Android compile SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Remove generated placeholder test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Set file_picker Android compile SDK
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/file_picker-*/android/*gradle*' -type f -print0 |
            while IFS= read -r -d '' GRADLE_FILE; do
              sed -i -E \
                -e 's/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g' \
                -e 's/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g' \
                "$GRADLE_FILE"
            done
          echo "file_picker Gradle compile SDK patch applied where a hard-coded API 34 setting exists."
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lets-talk-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
